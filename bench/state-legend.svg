  <circle cx="112" cy="435" r="20" fill="#aaa"/>
  <text x="165" y="444" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#171717">NOBODY</text>
  <text x="490" y="444" font-family="Arial, sans-serif" font-size="24" fill="#333">Light off</text>
