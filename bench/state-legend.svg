  <line x1="70" y1="150" x2="830" y2="150" stroke="#aaa" stroke-width="2"/>
  <circle cx="112" cy="215" r="20" fill="#d71920"/>
  <text x="165" y="224" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#171717">NEAR</text>
